project_name: "presidential-readability"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # PRIMARY SOURCE — same corpus as the shipped `presidential-speeches` project,
  # re-used here to answer a DIFFERENT question: how the READABILITY (reading-grade
  # level) of presidential speeches has changed 1789 -> present.
  #
  # Miller Center (UVA) curated presidential speech corpus — a single bulk tgz that
  # expands to speeches/*.json (one speech per file: transcript + title/date/president).
  # Public domain; Miller Center deprecated its API in favor of this bulk download.
  # 01-ingest fetches + unpacks the tgz directly (see src/ingest.py::ingest_miller_center).
  miller_center_speeches:
    url: https://data.millercenter.org/miller_center_speeches.tgz
    type: archive_tgz          # download + extract; parse speeches/*.json
    js_render: false
    rate_limit_seconds: 2.0

  # LATER EXPANSION (not first ingest) — The American Presidency Project (UCSB),
  # the fuller ~130k-document corpus. Add when broadening past the Miller Center set.
  # american_presidency_project:
  #   url: https://www.presidency.ucsb.edu/documents
  #   type: html_scrape
  #   js_render: false
  #   rate_limit_seconds: 2.0

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
